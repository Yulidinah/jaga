<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123d35" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>JAGA — Joint Alert, Guidance & Assistance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><polygon points="1 6 8 2 16 6 23 2 23 18 16 22 8 18 1 22 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="4"/><circle cx="12" cy="14" r="3"/><path d="M9 6h6"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="19" r="3"/><circle cx="18" cy="5" r="3"/><path d="M6 16V9a4 4 0 0 1 4-4h5"/></symbol>
    <symbol id="i-signal" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="JAGA beranda">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span><strong>JAGA</strong><small>Siaga bersama</small></span>
      </a>
      <div class="role-switcher">
        <small>Tampilan peran</small>
        <button id="roleButton" aria-expanded="false"><span class="role-dot"></span><b id="roleName">JAGA Desa</b><span class="chev">⌄</span></button>
        <div class="role-menu" id="roleMenu">
          <button data-role="pusat"><span class="role-icon">P</span><span><b>JAGA Pusat</b><small>Administrasi nasional</small></span></button>
          <button data-role="desa" class="selected"><span class="role-icon">D</span><span><b>JAGA Desa</b><small>Respons tingkat desa</small></span></button>
          <button data-role="rescue"><span class="role-icon">R</span><span><b>JAGA Rescue</b><small>Operasi lapangan</small></span></button>
        </div>
      </div>
      <nav id="mainNav"></nav>
    </aside>

    <main>
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuButton" aria-label="Buka menu"><svg><use href="#i-menu"/></svg></button>
        <div class="mobile-brand"><span class="brand-mark"><span></span><span></span><span></span></span><b>JAGA</b></div>
        <div class="top-actions">
          <div class="network-pill"><span></span><b id="networkStatus">Menghubungkan</b><small id="networkCount">— perangkat</small></div>
          <button class="icon-btn notification" aria-label="Notifikasi"><svg><use href="#i-bell"/></svg><span id="notificationCount">0</span></button>
          <button class="avatar">AS</button>
        </div>
      </header>
      <div class="content" id="content"></div>
      <nav class="mobile-nav" id="mobileNav"></nav>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast"><svg><use href="#i-check"/></svg><span></span></div>
  <div class="modal-backdrop" id="modal">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose">×</button>
      <div class="modal-icon"><svg><use href="#i-bell"/></svg></div>
      <p class="eyebrow">KONFIRMASI MANUSIA</p>
      <h2 id="modalTitle">Aktifkan peringatan?</h2>
      <p id="modalDescription">Peringatan multisensori akan dikirim ke perangkat JAGA Rumah yang dipilih.</p>
      <label class="confirm-check"><input type="checkbox" id="confirmCheck"><span>Saya telah memverifikasi kondisi dengan tim lapangan.</span></label>
      <div class="modal-actions"><button class="btn ghost" id="modalCancel">Batalkan</button><button class="btn danger" id="modalConfirm" disabled>Aktifkan alarm</button></div>
    </section>
  </div>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
